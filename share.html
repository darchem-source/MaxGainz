<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Shared workout · Max Gainz</title>
<style>
  :root { color-scheme: dark; --bg:#0f120e; --surface:#171b15; --line:#2b3127; --ink:#eef2ea; --muted:#a3ab9e; --accent:#c8ff00; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding:24px 16px 48px; }
  main { max-width:560px; margin:0 auto; }
  .brand { font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--accent); text-transform:uppercase; }
  h1 { font-size:28px; line-height:1.15; margin:8px 0 2px; }
  .sub { color:var(--muted); font-size:14px; }
  .stats { display:flex; flex-wrap:wrap; gap:18px; margin:18px 0 8px; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--muted); font-size:12px; }
  section { margin-top:18px; }
  h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  .row { padding:10px 0; border-top:1px solid var(--line); }
  .row strong { font-weight:700; }
  .pb { background:rgba(200,255,0,.15); color:var(--accent); font-size:11px; font-weight:800; padding:1px 6px; border-radius:6px; margin-left:6px; }
  .detail, .note { color:var(--muted); font-size:13px; }
  .note { font-style:italic; }
  .foot { margin-top:28px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); padding-top:12px; }
  .msg { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="brand">Max Gainz</div>
  <p class="sub">Loading shared workout…</p>
</main>
<script src="share.js"></script>
</body>
</html>
