[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Private share viewer (Phase 3): no app code, strict CSP, never indexed, no
# referrer, never cached. The link token lives in the #fragment.
[[headers]]
  for = "/share.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://lxudaetjuefylgjddonm.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/share"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://lxudaetjuefylgjddonm.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/share.js"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

# Web app manifest (Phase 4: iOS needs it to treat a Home Screen install as an
# app that can receive Web Push). Served with its proper type, revalidated.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

# App modules (Priority 7 slice 6): the page asks for /app/<name>.js?v=<build>;
# always revalidate so a deploy is never hidden behind an HTTP cache.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
